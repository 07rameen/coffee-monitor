version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt

  build:
    commands:
      - echo "Running Coffee Monitor build..."
      - python -c "from storage.db import init_db; init_db(); print('DB initialized')"

  post_build:
    commands:
      - echo "Build complete!"

artifacts:
  files:
    - '**/*'
